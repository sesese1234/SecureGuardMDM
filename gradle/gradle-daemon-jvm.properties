#This file is generated by updateDaemonJvm
#
#toolchainVendor is deliberately left unset. Pinning it to "jetbrains" (picked up
#from the IDE's bundled runtime) makes the build fail anywhere a JetBrains JDK is
#not already installed, because Gradle has no download URL for that vendor:
#  Unable to download toolchain matching the requirements
#  ({languageVersion=21, vendor=JetBrains, ...})
#Any JDK 21 satisfies the build, including the JetBrains Runtime.
toolchainVersion=21
