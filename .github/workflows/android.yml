name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
      ANDROID_HOME: ${{ runner.temp }}/android-sdk

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Gradle Wrapper Executable
      run: |
        if [ -f ./gradlew ]; then
          chmod +x ./gradlew || true
        fi

    - name: Show environment and diagnostics
      run: |
        echo "=== java -version ==="
        java -XshowSettings:properties -version || java -version || true
        echo "=== gradle wrapper file info ==="
        ls -la gradlew gradle || true
        echo "=== gradle-wrapper.properties ==="
        cat gradle/wrapper/gradle-wrapper.properties || true
        echo "=== ./gradlew --version ==="
        ./gradlew --version || true
        echo "=== print PATH ==="
        echo $PATH || true

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Android SDK (command-line tools)
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest" || true
        fi
        # Ensure tools are visible to subsequent steps by writing to GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
        echo "=== sdkmanager list ==="
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --list || true
      shell: bash

    - name: Force Headless Mode for KSP and Kotlin
      run: |
        echo "" >> gradle.properties
        echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx6144m" >> gradle.properties
        echo "kotlin.daemon.jvmopts=-Djava.awt.headless=true" >> gradle.properties
        echo "ksp.incremental=false" >> gradle.properties

    - name: Run Gradle Build (capture output)
      continue-on-error: true
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SecureGuardMDM-debug-apk
        path: app/build/outputs/apk/debug/*.apk