name: Build APK

on:
  push:
    branches:
      - main
      - PreBuild
      - Pre-Release
      - 'claude/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug and release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The project builds native code through ndk-build (app/src/main/jni/Android.mk)
      # and does not pin ndkVersion, so the NDK has to be present before AGP looks for it.
      - name: Install the NDK
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew is committed without the executable bit.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Assemble release APK (unsigned)
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: abloq-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: abloq-release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
